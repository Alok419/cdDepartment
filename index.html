<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Clinical Analyzer (Unified)</title>
    <style>
        /* --- GLOBAL THEME (Professional Dark Mode) --- */
        :root {
            --bg-dark: #0b1f2a;
            --card-bg: #081821;
            --border: #1f3a4d;
            --text-main: #ffffff;
            --text-muted: #8daac2;
            --accent-blue: #4fa3ff;
            --accent-hover: #7abaff;
            --accent-green: #4ade80;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .main-wrapper {
            width: 100%;
            max-width: 900px;
        }

        /* --- CARD DESIGN --- */
        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        h2.main-title {
            margin: 0 0 10px 0;
            font-weight: 600;
            font-size: 24px;
            text-align: center;
            color: #e0e0e0;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin: 0 0 30px 0;
        }

        /* --- UPLOAD SECTION --- */
        .upload-zone {
            border: 2px dashed #355a74;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            background: #06141c;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .upload-zone:hover {
            border-color: var(--accent-blue);
            background: #081d2a;
        }

        .upload-icon {
            font-size: 40px;
            color: var(--accent-blue);
            margin-bottom: 10px;
        }

        .upload-text {
            font-size: 16px;
            font-weight: 600;
            color: #d6eaff;
        }

        .upload-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* --- FILE LIST --- */
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .file-item {
            background: #fff;
            border-radius: 8px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #333;
        }

        .file-name {
            font-weight: 600;
            font-size: 14px;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .remove-btn {
            background: transparent;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 16px;
        }
        .remove-btn:hover { color: var(--error); }

        /* --- ACTIONS & BUTTONS --- */
        .analyze-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0176d3 0%, #4fa3ff 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .analyze-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(1, 118, 211, 0.4);
        }

        .analyze-btn:disabled {
            background: #4b5563;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            font-weight: 700;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }
        .save-btn:hover:not(:disabled) { transform: translateY(-1px); }
        .save-btn:disabled { background: #4b5563; box-shadow: none; cursor: not-allowed; }

        /* --- RESULTS --- */
        .result-box {
            width: 100%;
            background: #050e13;
            color: #a6e22e; /* Monokai Green */
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            font-family: "Consolas", "Monaco", monospace;
            font-size: 13px;
            resize: vertical;
            min-height: 400px;
            box-sizing: border-box;
            outline: none;
        }

        /* --- PROGRESS BAR --- */
        #progressWrapper {
            margin-top: 20px;
            display: none;
        }
        .progress-track {
            background: #102a3a;
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4fa3ff, #00d2ff);
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            font-size: 12px;
            color: var(--accent-blue);
            display: flex;
            justify-content: space-between;
        }

        /* --- UTILS --- */
        .status { text-align: center; margin-top: 15px; font-size: 14px; min-height: 20px; }
        .success { color: var(--success); }
        .error { color: var(--error); }
        .hidden { display: none; }
        .disabled-ui { opacity: 0.5; pointer-events: none; }

        #loadingMessage {
            text-align: center;
            color: var(--accent-blue);
            margin-bottom: 20px;
            font-style: italic;
        }

    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="card" id="mainCard" style="display:none;">
            <h2 class="main-title">AI Oasis Clinical Analyzer</h2>
            <p class="subtitle">Unified Processing: OASIS & PT/OT Evaluations</p>

            <div id="inputSection">
                <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📂</div>
                    <div class="upload-text">Upload Patient Documents</div>
                    <div class="upload-hint">OASIS PDFs, PT/OT Evals, Progress Notes</div>
                    <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" multiple onchange="handleFileSelect(this)" hidden>
                </div>

                <div id="fileSectionHeader" class="hidden" style="margin-bottom:10px; font-size:14px; color:#ccc;">
                    Selected Files (<span id="fileCount">0</span>)
                </div>
                <div id="fileListContainer" class="file-list"></div>

                <button id="analyzeBtn" class="analyze-btn" onclick="startAnalysis()">Analyze Documents</button>
            </div>

            <div id="progressWrapper">
                <div class="progress-text">
                    <span id="progressStatus">Initializing...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressBar"></div>
                </div>
            </div>

            <div id="resultSection" class="hidden" style="margin-top: 25px;">
                <p style="font-size:12px; color:#888; margin-bottom: 5px; display:none;">Combined Extracted Data (OASIS + PT/OT)</p>
                <textarea id="combinedOutput" style="display:none;" class="result-box" placeholder="Waiting for analysis..."></textarea>
                <button id="saveBtn" class="save-btn" onclick="finalizeSave()">Save All Data & Files</button>
            </div>

            <div id="status" class="status"></div>
        </div>

        <div id="loadingMessage">Connecting to Salesforce...</div>
    </div>

<script>
/* =========================================================
   GLOBAL CONTEXT & CONFIG
   ========================================================= */
let CHART_ID = null;
let GEMINI_API_KEY = null;
let SF_SESSION_ID = null;
let SF_BASE_URL = null;
let CACHED_AI_TIME = 0;

let selectedFiles = [];

// Using Gemini 1.5 Pro
const GEMINI_PRO_ENDPOINT = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-pro-preview:generateContent";

/* =========================================================
   SALESFORCE CONNECTION
   ========================================================= */
window.addEventListener("message", (event) => {
    if (event.data && event.data.type === "SF_CONTEXT") {
        console.log("✅ Received Context from Salesforce");
        CHART_ID = event.data.recordId;
        GEMINI_API_KEY = event.data.apiKey;
        SF_SESSION_ID = event.data.sessionId;
        SF_BASE_URL = event.data.baseUrl;

        document.getElementById("loadingMessage").style.display = "none";
        document.getElementById("mainCard").style.display = "block";
    }
});

/* =========================================================
   UI LOGIC
   ========================================================= */
function handleFileSelect(inputElement) {
    if (inputElement.files && inputElement.files.length > 0) {
        for (let i = 0; i < inputElement.files.length; i++) {
            const file = inputElement.files[i];
            if(!selectedFiles.some(f => f.name === file.name && f.size === file.size)) {
                selectedFiles.push(file);
            }
        }
        renderFileList();
        inputElement.value = "";
    }
}

function removeFile(index) {
    selectedFiles.splice(index, 1);
    renderFileList();
}

function renderFileList() {
    const container = document.getElementById("fileListContainer");
    const header = document.getElementById("fileSectionHeader");
    const countSpan = document.getElementById("fileCount");

    container.innerHTML = "";
    if (selectedFiles.length === 0) {
        container.classList.add("hidden");
        header.classList.add("hidden");
        return;
    }

    header.classList.remove("hidden");
    container.classList.remove("hidden");
    countSpan.innerText = selectedFiles.length;

    selectedFiles.forEach((file, index) => {
        const item = document.createElement("div");
        item.className = "file-item";
        item.innerHTML = `
            <span class="file-name">📄 ${file.name}</span>
            <button class="remove-btn" onclick="removeFile(${index})">×</button>
        `;
        container.appendChild(item);
    });
}

function showStatus(msg, isError = false) {
    const el = document.getElementById("status");
    el.innerHTML = msg;
    el.className = "status " + (isError ? "error" : "success");
}

/* =========================================================
   PROGRESS LOGIC
   ========================================================= */
let progressTimer = null;
let progressValue = 0;

function startProgress() {
    document.getElementById("progressWrapper").style.display = "block";
    progressValue = 0;
    updateProgress(0, "Starting...");
    progressTimer = setInterval(() => {
        if (progressValue < 90) {
            progressValue++;
            updateProgress(progressValue);
        }
    }, 150);
}

function stopProgress() {
    clearInterval(progressTimer);
    updateProgress(100, "Complete");
   
}

function updateProgress(val, text) {
    document.getElementById("progressBar").style.width = val + "%";
    document.getElementById("progressPercent").innerText = val + "%";
    if (text) document.getElementById("progressStatus").innerText = text;
}

/* =========================================================
   MAIN ANALYSIS LOGIC (PARALLEL PROCESSING & MERGE)
   ========================================================= */
async function startAnalysis() {
    const combinedOutput = document.getElementById("combinedOutput");
    const analyzeBtn = document.getElementById("analyzeBtn");

    // Reset UI
    combinedOutput.value = "";
    showStatus("");
    document.getElementById("resultSection").classList.add("hidden");

    if (!GEMINI_API_KEY) { showStatus("❌ Missing API Key", true); return; }
    if (selectedFiles.length === 0) { showStatus("❌ Select files first", true); return; }

    try {
        analyzeBtn.disabled = true;
        document.getElementById("inputSection").classList.add("disabled-ui");
        startProgress();

        const startTime = Date.now();

        // 1. Read Files
        updateProgress(10, "Reading files...");
        const fileDataArray = await Promise.all(selectedFiles.map(readFileAsBase64));

        // 2. Parallel AI Calls (Separate Prompts)
        updateProgress(30, "AI Analysis Running (OASIS + PT/OT)...");

        // Run both OASIS and PT/OT extraction in parallel
        const results = await Promise.allSettled([
            runOasisExtraction(fileDataArray),
            runPtOtExtraction(fileDataArray)
        ]);

        CACHED_AI_TIME = Math.floor((Date.now() - startTime) / 1000);

        // 3. Process & Merge Results
        updateProgress(80, "Merging Data...");
        
        let mergedJson = {};

        // Helper to parse safely
        const safeParse = (str) => {
            try {
                let clean = str.replace(/```json/g, "").replace(/```/g, "").trim();
                const firstOpen = clean.indexOf('{');
                const lastClose = clean.lastIndexOf('}');
                if (firstOpen !== -1 && lastClose !== -1) {
                    clean = clean.substring(firstOpen, lastClose + 1);
                }
                return JSON.parse(clean);
            } catch (e) {
                console.warn("Partial Parse Error:", e);
                return {};
            }
        };

        // Merge OASIS Result
        if (results[0].status === "fulfilled") {
            const oasisData = safeParse(results[0].value);
            mergedJson = { ...mergedJson, ...oasisData };
        } else {
            console.error("OASIS Failed:", results[0].reason);
        }

        // Merge PT/OT Result
        if (results[1].status === "fulfilled") {
            const ptotData = safeParse(results[1].value);
            mergedJson = { ...mergedJson, ...ptotData };
        } else {
            console.error("PTOT Failed:", results[1].reason);
        }

        // 4. Display Combined JSON
        combinedOutput.value = JSON.stringify(mergedJson, null, 4);

        document.getElementById("resultSection").classList.remove("hidden");
        stopProgress();
        showStatus("✅ Analysis Complete", false);
        document.getElementById("inputSection").style.display = "none";


    } catch (err) {
        console.error(err);
        clearInterval(progressTimer);
        showStatus("❌ " + err.message, true);
    } finally {
        analyzeBtn.disabled = false;
        document.getElementById("inputSection").classList.remove("disabled-ui");
    }
}

/* =========================================================
   AI FLOW 1: OASIS EXTRACTION
   ========================================================= */
async function runOasisExtraction(fileDataArray) {
    const prompt = `
    You are a specialized Clinical Document Extractor. Your job is to extract data from an OASIS-E1 Home Health Assessment PDF.

    VISUAL INSTRUCTIONS
    This is a visual extraction task. Do not rely solely on text stream order. Look at the layout.
    Identify selected values by looking for: ☑ (checked box), [X] (marked box), ■ (filled box), or (◉) circled numbers.
    Ignore unchecked boxes (☐, [ ],()).

    DATA FORMATTING RULES (CRITICAL)
    - NO LEADING ZEROS: If a value is "01", return "1". If "02", return "2". (Exception: Return "0" if the value is exactly zero). EXCEPTION FOR GG CODES: For GG items (e.g., GG0130, GG0170), KEEP the leading zero (e.g., return "06", "05", "01").
    - ONLY CODES: For M-Items and GG-Items, return ONLY the numeric code (e.g., "1", "06"), do NOT return the text description.
    - MULTI-SELECT: If multiple boxes are checked, separate with commas (e.g., "1, 2").
    - DATES: Extract dates strictly in YYYY-MM-DD format. If a date is missing, return "N/A".
    - MISSING DATA: If an item is not found, not visually marked, or blank, you MUST return "N/A". Do NOT return null, empty strings, or exclude the key.

    SECTION SPECIFIC RULES
    -M-Items & B/D-Items:
    - Find the question ID (e.g., M1830, B1000).
    - Find the option that is VISUALLY marked.
    - Extract the numeric code associated with that option.

    ITEMS TO EXTRACT
    - If an item is not found or not visually marked, return "N/A".

    --- CHART DATA ---
    - M0030 (Start of Care Date) -> Return YYYY-MM-DD
    - M0032 (Resumption of Care Date) -> Return YYYY-MM-DD
    - M0060 (Zip Code) -> Return ONLY the first 5 characters. Ignore any suffix.
    - M0110 (Episode Timing) -> Return code "1" (Early) or "2" (Later)
    - M1005 (Inpatient Discharge Date) -> Return YYYY-MM-DD
    - M0069 (Gender) -> Return code "1" (Male) or "2" (Female).
    - M0080 (Discipline) -> Return code "1" (RN), "2" (PT), "3" (SLP/ST), "4" (OT).

    --- PLAN OF CARE / ORDERS ---
    - Activities Permitted:
    Look for the header "Activities Permitted".
    Return a comma-separated list of EVERY checkbox that is visually marked.
    - DME:
    Look for the header "DME".
    Return a comma-separated list of EVERY checkbox that is visually marked.

    --- OASIS ITEMS ---
    - M0090 (Date Assessment Completed) -> Return YYYY-MM-DD
    - M1000 (Inpatient Discharge History - list all checked numbers 1-7)
    - M1033 (Risk for Hospitalization – list all checked numbers)
    - B1000 (Vision)
    - M1400 (Dyspnea)
    - M1700 (Cognitive Functioning)
    - M1710 (When Confused)
    - M1720 (When Anxious)
    - M1740 (Cognitive/Behavioral Symptoms – list all checked numbers)
    - M1745 (Disruptive Behavior)
    - M1800 (Grooming)
    - M1810 (Upper Body Dressing)
    - M1820 (Lower Body Dressing)
    - M1830 (Bathing)
    - M1840 (Toilet Transfer)
    - M1845 (Toileting Hygiene)
    - M1850 (Transferring)
    - M1860 (Ambulation)
    - M1870 (Feeding) 
    - M2020 (Oral Medications)
    - J0530 (Pain Interference with Activities)

    --- GG ITEMS (SELF-CARE & MOBILITY) ---
    - Extract the "SOC/ROC Performance" code (e.g., 06, 05, 04, 03, 02, 01, 07, 09, 10, 88) for the following items:
    - GG0130 B (Oral Hygiene)
    - GG0130 C (Toileting Hygiene)
    - GG0130 E (Shower/Bathe Self)
    - GG0130 F (Upper Body Dressing)
    - GG0130 G (Lower Body Dressing)
    - GG0130 H (Footwear)
    - GG0170 A (Roll left/right)
    - GG0170 B (Sit to lying)
    - GG0170 C (Lying to sitting)
    - GG0170 D (Sit to stand)
    - GG0170 E (Chair/bed transfer)
    - GG0170 F (Toilet transfer)
    - GG0170 I (Walk 10 feet)
    - GG0170 J (Walk 50 feet w/ turns)
    - GG0170 K (Walk 150 feet)
    - GG0170 L (Walk 10 feet uneven)
    - GG0170 M (1 step/curb)
    - GG0170 N (4 steps)
    - GG0170 O (12 steps)
    - GG0170 R (Wheel 50 feet)
    - GG0170 S (Wheel 150 feet)

    --- D0150 PATIENT MOOD INTERVIEW ---
    - This section has two columns. Extract the numeric code for checks in Row A and Row B.
    - Row A (Little interest): Col 1 (Symptom), Col 2 (Frequency)
    - Row B (Feeling down): Col 1 (Symptom), Col 2 (Frequency)

    --- SALESFORCE OUTPUT REQUIREMENT (MANDATORY) ---
    - You must identify values using the OASIS codes above, but the FINAL OUTPUT must use the specific JSON keys below.
    - Use this mapping EXACTLY:
    - SOC_Date -> M0030 (YYYY-MM-DD)
    - ROC_Date -> M0032 (YYYY-MM-DD)
    - Zip_Code -> M0060 (First 5 digits only)
    - Episode_Timing -> M0110 (1 or 2)
    - M0069 -> M0069 (1 or 2)
    - M0080 -> M0080 (1, 2, 3, or 4)
    - Inpatient_Discharge_Date -> M1005 (YYYY-MM-DD)
    - M0090_Date_Assessment_Completed -> M0090 (YYYY-MM-DD)
    - M1000_Discharge_History -> M1000 (Comma separated list of codes)
    - Activities Permitted -> Activities_Permitted__c
    - DME -> DME_Supplies__c
    - B1000 -> M1200_Vision__c
    - D0150 Row A Col 1 -> Little_interest_symptom_presence__c
    - D0150 Row A Col 2 -> Little_interest_symptom_frequency__c
    - D0150 Row B Col 1 -> Feeling_down_symptom_presence__c
    - D0150 Row B Col 2 -> Feeling_down_symptom_frequency__c
    - M1033 -> Functional_Points_M1033__c
    - M1400 -> M1400_SOB_Actual__c
    - M1700 -> M1700_Cognitive_Functioning__c
    - M1710 -> M1710_When_Confused__c
    - M1720 -> M1720_When_Anxious__c
    - M1740 -> M1740_Cognitive_behavioral_and__c
    - M1745 -> M1745_Frequncy_of_Disruptive_Behavior__c
    - M1800 -> M1800_Grooming_Actual__c
    - M1810 -> M1810_Ability_to_Dress_Upper_Body_Actual__c
    - M1820 -> M1820_Ability_to_Dress_Lower_Body_Actual__c
    - M1830 -> M1830_Bathing_Actual__c
    - M1840 -> M1840_Toilet_Transferring_Actual__c
    - M1845 -> M1845_Toilet_Hyg_Actual__c
    - M1850 -> M1850_Transferring_Actual__c
    - M1860 -> M1860_Ambulation_Locomotion_Actual__c
    - M1870 -> M1870_Feeding_Actual__c
    - M2020 -> M2020_Oral_Medications_Actual__c
    - J0530 -> J0530_Pain_Interference_with_Day_to_Da__c

    - GG0130 B -> GG0130_B_Oral_Hygiene__c
    - GG0130 C -> GG0130_C_Toileting_Hygiene__c
    - GG0130 E -> GG0130_E_Shower_bathe_self__c
    - GG0130 F -> GG0130_F_Upper_body_dressing__c
    - GG0130 G -> GG0130_G_Lower_body_dressing__c
    - GG0130 H -> GG0130_H_Putting_on_taking_off_footwear__c
    - GG0170 A -> GG0170_A_Roll_left_and_right__c
    - GG0170 B -> GG0170_B_Sit_to_lying__c
    - GG0170 C -> GG0170_C_Lying_to_sitting_on_side_of_bed__c
    - GG0170 D -> GG0170_D_Sit_to_stand__c
    - GG0170 E -> GG0170_E_Chair_bed_to_chair_transfer__c
    - GG0170 F -> GG0170_F_Toilet_transfer__c
    - GG0170 I -> GG0170_I_Walk_10_feet__c
    - GG0170 J -> GG0170_J_Walk_50_feet_with_two_turns__c
    - GG0170 K -> GG0170_K_Walk_150_feet__c
    - GG0170 L -> GG0170_L_Walking_10_feet_on_uneven_surf__c
    - GG0170 M -> GG0170_M_1_step_curb__c
    - GG0170 N -> GG0170_N_4_steps__c
    - GG0170 O -> GG0170_O_12_steps__c
    - GG0170 R -> GG0170_R_Wheel_50_feet_with_two_turns__c
    - GG0170 S -> GG0170_S_Wheel_150_feet__c

    FINAL OUTPUT FORMAT (STRICT)
    - Return ONLY valid JSON.
    - Return a SINGLE flat JSON object.
    - Keys MUST be the specific keys listed above.
    - Values MUST be strings.
    - Use comma-separated values for multi-select items.
    - If an item is not found or not marked, return "N/A".
    - Do NOT include markdown, backticks, explanations, or extra text.
    - Do NOT include OASIS codes in the output keys.
    - Do NOT add or remove keys.

    PICKLIST NORMALIZATION RULES (MANDATORY)
    - Document wording and layouts may vary. Use semantic meaning, not exact text.
    - Normalize selections to the VALID Salesforce picklist values below.
    - Return ONLY the exact picklist label.

    Activities Permitted — VALID VALUES
    Complete Bed Rest, Up as Tolerated, Excercise Prescribed, Independent at Home, Cane, Walker, Best Rest BRP, Transfer Bed-Chair, Partial Weight Bearing, Crutches, Wheelchair, Other, Needs assist with ADLs, Transfer Assistance, Fall Precautions, Slow Position Changes, Wound Care, Abdom. Surgery Precautions, Requires Supervision

    DME — VALID VALUES
    Bedside Commode, Cane, Elevated Toilet Seat, Grab Bars, Hospital Bed, Nebulizer, Oxygen, Tub/Shower Bench, Walker, Wheelchair, Other, Bed Overlay, Brace/Orthotics, Crutches, Hoyer Lift, Respiratory Equipment, Slider Board, Trapeze, No-DME, CPAP Machine, Diabetic Supplies, Vital Sign Equipment, Removable Shower Head, Scooter, Wound Care Supplies, Alcohol/Hand Sanitizer, Lab Supplies, PPE

    OUTPUT ENFORCEMENT
    - Output ONLY valid picklist labels.
    - Multiple values must be comma-separated.
    - If nothing applies, return "N/A".
    `;

    return await callGeminiProVision(prompt, fileDataArray);
}

/* =========================================================
   AI FLOW 2: PT/OT EXTRACTION
   ========================================================= */
async function runPtOtExtraction(fileDataArray) {
    const prompt = `
    Role - You are an expert Medical Data Encoder.

    Task -  Extract functional assessment data from the attached Physical Therapy (PT) or Occupational Therapy (OT) documents and map the values to a specific JSON structure using strict standardization rules.

    CRITICAL INSTRUCTION: 
    1. Do NOT guess information. 
    2. If the document is NOT a specific PT or OT evaluation (e.g., if it is ONLY an OASIS form), you MUST return an empty JSON object: {}.
    3. Do NOT use data from OASIS M-items or GG-items to populate PT/OT specific fields unless they are explicitly found in a separate PT/OT Evaluation section.

    1. Value Mapping Logic (Strict)

    You must convert the raw text found in the document (e.g., "Min A", "04", "CGA") into the exact string values listed in the Target Output (Required Value) column below.
    Use the Terms/Codes Found in Doc column to identify the correct match.

    Functional Level    Terms / Codes Found in Doc  Target Output (Required Value)
    6   06, Ind, Independent, I, Safe   "6"
    5   05, Mod I, Modified Independent, MI, Setup/Cleanup  "5"
    4   Walker/Cane used w/o assist, Assist with Device "4"
    4   Sup, Supervision, ST    "4"
    4   SBA, Stand By Assist, SC    "4"
    4   CGA, Contact Guard Assist, Caregiver Assist, Required Assistance    "4"
    3   03, Min A, Minimum Assist, PM, 25%  "3"
    3   Mod A, Moderate Assist, 50% "3"
    2   02, Max A, Max Assistance, SM, 75%  "2"
    1   01, Dep, Dependent, Total Assist, >75%, Unable  "1"
    NT  NT, N/A, Not Attempted, Not Tested  "NT"

    Note:
    If the document uses checkmarks, map the column header (e.g., MIN, MOD, MAX) to the corresponding Target Output.

    2. Extraction Instructions

    Determine Discipline
    Identify whether the document is PT or OT and populate only the relevant fields.

    Find Current Status
    Extract the CURRENT status only.
    Ignore values from Prior Level, Previous, or Goal columns.

    Ambiguity Handling

    If the value is PM, map to "3".

    If the value is SM, map to "2" (unless explicitly labeled Moderate).

    Null Handling

    If a field is not found in the document, exclude it from the JSON or set it to null.

    3. JSON Output Structure

    Return only a valid JSON object using the keys below. Do NOT use markdown code blocks.

    Occupational Therapy (OT) Fields

    (Only populate these if analyzing an OT document)

    Date_of_OT_Eval__c → Format: YYYY-MM-DD

    GG_OT_Feeding__c → Look for Eating / Feeding

    GG_OT_Oral_Hygiene__c → Look for Teeth / Dentures / Oral

    GG_OT_Grooming__c → Look for Grooming / Hygiene

    GG_OT_Toilet_Hygiene__c → Look for Toileting Hygiene / Clothing Management

    GG_OT_Bathing__c → Look for Bathing / Washing Body

    GG_OT_Upper_Body_Dressing__c → Look for Upper Body Dressing

    GG_OT_Lower_Body_Dressing__c → Look for Lower Body Dressing

    GG_OT_Sock_Shoes__c → Look for Footwear / Shoes / Socks

    If combined with Lower Body Dressing, use that score.

    GG_OT_Car_Van__c → Look for Car Transfer in OT section

    GG_OT_Toilet_Transfer__c → Look for Toilet Transfer in OT section

    Physical Therapy (PT) Fields

    (Only populate these if analyzing a PT document)

    GG_PT_Sit_Stand__c → Look for Sit to Stand transfer

    GG_PT_Bed_Wheelchair__c → Look for Bed to Chair / Wheelchair transfer

    GG_PT_Wheelchair_Bed__c → Look for Wheelchair to Bed transfer

    If not distinct, use Bed_Wheelchair value.

    GG_PT_Car_Van__c → Look for Car Transfer

    GG_PT_Toilet_Transfer__c → Look for Toilet Transfer / Commode

    GG_PT_Bathing__c → Look for Tub / Shower Transfer

    GG_PT_Level_10_Feet__c → Look for Ambulation / Gait – 10 ft

    GG_PT_Level_50_Feet__c → Look for Ambulation / Gait – 50 ft

    GG_PT_Level_150_Feet__c → Look for Ambulation / Gait – 150 ft

    GG_PT_Unlevel__c → Look for Uneven Surfaces

    GG_PT_1_Step__c → Look for 1 Step / Curb

    GG_PT_4_Steps__c → Look for 4 Steps

    GG_PT_12_Steps__c → Look for 12 Steps / Full Flight

    General Fields (All Documents)

    Complete_PT_OT_Eval__c → Always set to "Yes"

    Date_of_PT_OT_Eval__c → Date of evaluation (YYYY-MM-DD)

    Bed_Mobility__c → Look for Rolling Left / Right

    Transfer__c → Look for Supine to Sit / Sit to Supine

    Gait__c → Look for general ambulation if distances are not listed

    Wheelchair_Mobility__c → Look for Wheelchair use / propulsion

     Other__c → Look for Unlevel or Uneven Surfaces (Level / Unlevel / Uneven / Uneven surface / Walk on uneven surfaces and Populate this field using the same Value Mapping Logic defined above.)
    `;

    return await callGeminiProVision(prompt, fileDataArray);
}

/* =========================================================
   GEMINI CALLER
   ========================================================= */
async function callGeminiProVision(promptText, fileDataArray) {
    const parts = [{ text: promptText }];
    fileDataArray.forEach(f => {
        parts.push({ inlineData: { mimeType: f.mimeType, data: f.base64 } });
    });

    const response = await fetch(`${GEMINI_PRO_ENDPOINT}?key=${GEMINI_API_KEY}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            contents: [{ parts: parts }],
            safetySettings: [
                { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_ONLY_HIGH" },
                { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_ONLY_HIGH" },
                { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_ONLY_HIGH" },
                { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_ONLY_HIGH" }
            ]
        })
    });

    if (!response.ok) {
        const err = await response.text();
        throw new Error("Gemini API Error: " + err);
    }
    const data = await response.json();
    
    if (!data.candidates || data.candidates.length === 0) {
        if(data.promptFeedback && data.promptFeedback.blockReason) {
             throw new Error("AI Blocked: " + data.promptFeedback.blockReason);
        }
        throw new Error("No response candidates returned.");
    }
    
    return data.candidates[0].content.parts[0].text;
}

/* =========================================================
   SAVE LOGIC (SINGLE API CALL)
   ========================================================= */
async function finalizeSave() {
    // hide this div inputSection 
    
    const saveBtn = document.getElementById("saveBtn");
    const combinedData = document.getElementById("combinedOutput").value;

    if(!CHART_ID) {
        showStatus("❌ Error: Missing Salesforce Chart ID.", true);
        return;
    }

    try {
        saveBtn.disabled = true;
        saveBtn.innerText = "Saving...";

        // 1. Upload Files first (Sequential to be safe)
        if (selectedFiles.length > 0) {
            await uploadFiles();
        }

        // 2. Save Data (SINGLE Call for both OASIS and PT/OT keys)
        if (combinedData && combinedData.length > 5) {
            await sendToApex(`${SF_BASE_URL}/services/apexrest/oasis/ai-result`, {
                chartId: CHART_ID,
                rawJson: combinedData, // Contains merged keys
                aiTimeSeconds: CACHED_AI_TIME
            });
        }

        showStatus("✅ All Data & Files Saved!", false);
        saveBtn.innerText = "Saved";
        setTimeout(() => {
             window.location.href = `${SF_BASE_URL}/lightning/r/Chart__c/${CHART_ID}/view`;
        }, 1500);

    } catch (e) {
        console.error(e);
        showStatus("❌ Save Failed: " + e.message, true);
        saveBtn.disabled = false;
        saveBtn.innerText = "Retry Save";
    }
}

async function sendToApex(endpoint, body) {
    const response = await fetch(endpoint, {
        method: "POST",
        headers: { "Authorization": "Bearer " + SF_SESSION_ID, "Content-Type": "application/json" },
        body: JSON.stringify(body)
    });
    if (!response.ok) {
        const errText = await response.text();
        throw new Error(`Apex Error (${response.status}): ` + errText);
    }
}

async function uploadFiles() {
    const endpoint = `${SF_BASE_URL}/services/data/v60.0/sobjects/ContentVersion`;
    for (let file of selectedFiles) {
        const fileData = await readFileAsBase64(file);
        await fetch(endpoint, {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + SF_SESSION_ID,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                "Title": file.name,
                "PathOnClient": file.name,
                "VersionData": fileData.base64,
                "FirstPublishLocationId": CHART_ID,
                "Origin": "H"
            })
        });
    }
}

function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({ mimeType: file.type, base64: reader.result.split(",")[1], name: file.name });
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}
